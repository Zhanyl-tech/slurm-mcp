[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `slurm-mcp` on PyPI is an unrelated project by another author, so the
# distribution is named for what it is. The command and the import package are
# still `slurm-mcp` / `slurm_mcp`.
name = "slurm-readonly-mcp"
dynamic = ["version"]
description = "A read-only MCP server exposing Slurm scheduler state to agents, with progressive disclosure and the allowlist enforced in code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["slurm", "mcp", "hpc", "agents", "read-only", "gpu-cluster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
# server.py targets the mcp 2.x low-level API (constructor callbacks,
# snake_case fields, mcp.shared.exceptions.MCPError). mcp 1.x cannot run it: an
# audit found v0.1.0's server failing at `Server(...)` on 1.2.0 (no
# `instructions`) and 1.30.0 (no `on_list_tools`), and the current code fails
# earlier on 1.30.0, importing MCPError. 2.0.0 is the lowest release the
# transport tests and the stdio smoke test have been run against; CI runs both
# 2.0.0 and the newest 2.x.
server = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
slurm-mcp = "slurm_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Zhanyl-tech/slurm-mcp"

[tool.hatch.version]
path = "src/slurm_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
# The fixtures live inside the package (src/slurm_mcp/fixtures/) so `--fixtures`
# works from a wheel, not only from a source checkout.
packages = ["src/slurm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests", "scripts"]
python_version = "3.11"
strict = true
mypy_path = "src"

# `mcp` is an optional extra. This override only takes effect when mcp is NOT
# installed: then the guard, topics and CLI are still fully checked, and
# server.py's SDK types degrade to Any. When mcp is installed (the `server` CI
# job, or `pip install -e '.[dev,server]'`), mypy reads the SDK's own py.typed
# annotations and server.py is checked against the real API.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
