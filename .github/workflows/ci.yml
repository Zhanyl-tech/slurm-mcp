name: checks

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  guard:
    # Deliberately [dev] and not [server]: the guard is the security-relevant
    # code, and it must type-check and pass its adversarial suite on a machine
    # with no MCP transport installed at all.
    name: guard, no MCP (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: the MCP SDK is really absent in this job
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('mcp') is not None)"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: the CLI works without a Slurm cluster, and its exit codes mean something
        run: |
          set -x
          slurm-mcp surface
          slurm-mcp --fixtures overview
          slurm-mcp --fixtures query queue --filter user=mchen
          slurm-mcp footprint
          # No Slurm here, so a live read must fail loudly, not print "(no rows)".
          if slurm-mcp overview; then echo "live overview without Slurm exited 0"; exit 1; fi
          # Without the [server] extra, serve must explain itself and exit 2,
          # with an install command that works while the name is not on PyPI.
          set +e; slurm-mcp serve 2> serve.err; rc=$?; set -e
          test "$rc" -eq 2
          grep -qF 'slurm-readonly-mcp[server] @ git+https://github.com/Zhanyl-tech/slurm-mcp' serve.err

  server:
    # The transport the repo is named after: mypy against the real SDK, the
    # in-process and stdio transport tests, and the smoke script. Run against
    # the declared floor and the newest 2.x.
    name: server, ${{ matrix.mcp }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        mcp: ["mcp==2.0.0", "mcp>=2,<3"]
    env:
      # Turns tests/test_transport.py's skip-when-absent into a failure.
      SLURM_MCP_REQUIRE_TRANSPORT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,server]" "${{ matrix.mcp }}"
      - run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: mypy with the real SDK installed (py.typed), so server.py is checked against it
        run: mypy
      - run: pytest -q
      - run: python scripts/stdio_smoke.py

  wheel:
    # What a user gets from `pip install`, not from a checkout: fixtures must be
    # inside the wheel, and the console script must serve MCP over stdio.
    name: built wheel, outside the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip wheel --no-deps -w dist .
      - name: fixtures and the fixture README are inside the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          fixtures = sorted(n for n in names if "/fixtures/" in n)
          print("\n".join(fixtures))
          assert len([n for n in fixtures if n.endswith(".txt")]) == 7, fixtures
          EOF
      - name: install the wheel with [server] into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls dist/*.whl)[server]"
      - name: fixture mode works from the installed package
        working-directory: ${{ runner.temp }}
        run: |
          out="$("$RUNNER_TEMP/v/bin/slurm-mcp" --fixtures overview)"
          echo "$out"
          ! grep -q "no fixture" <<<"$out"
      - name: MCP over real stdio against the installed console script
        working-directory: ${{ runner.temp }}
        run: >
          "$RUNNER_TEMP/v/bin/python" "$GITHUB_WORKSPACE/scripts/stdio_smoke.py"
          "$RUNNER_TEMP/v/bin/slurm-mcp" --fixtures serve
